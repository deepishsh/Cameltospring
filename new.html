<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infosys Migration Accelerator - CAMEL to Spring Boot</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 50px;
            background-color: #f8f9fa;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .custom-file-input ~ .custom-file-label::after {
            content: "Browse";
        }
        .output-container {
            background: #e9ecef;
            padding: 20px;
            border-radius: 10px;
            height: 100%;
        }
        .output-content {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: #ffffff;
            border-radius: 5px;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Infosys Migration Accelerator - CAMEL to Spring Boot</h1>
        <div class="row">
            <div class="col-md-6">
                <h2>Upload CAMEL Project</h2>
                <form method="post" enctype="multipart/form-data" action="http://localhost:8080/camel">
                    <div class="form-group">
                        <div class="custom-file">
                            <input type="file" class="custom-file-input" id="file" name="file" required>
                            <label class="custom-file-label" for="file">Choose file</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Upload</button>
                </form>
            </div>
            <div class="col-md-6">
                <h2>Spring Boot Output</h2>
                <div class="output-container">
                    <div class="output-content" id="output-content">
                        <!-- Output will be displayed here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        // Update the file name in the label when a file is selected
        $('.custom-file-input').on('change', function(event) {
            var inputFile = event.currentTarget;
            $(inputFile).parent().find('.custom-file-label').html(inputFile.files[0].name);
        });

        // Example code to handle the output (this should be updated to reflect actual output handling)
        function displayOutput(content) {
            document.getElementById('output-content').innerText = content;
        }

        // Mock function to simulate output display (this should be replaced with actual implementation)
        function mockDisplayOutput() {
            displayOutput('Spring Boot output will be displayed here after the conversion process is completed.');
        }

        // Simulate output display on page load (for demonstration purposes)
        $(document).ready(function() {
            mockDisplayOutput();
        });
    </script>
</body>
</html>
