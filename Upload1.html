<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infosys Utility - CAMEL to Spring Migration</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 50px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .custom-file-input ~ .custom-file-label::after {
            content: "Browse";
        }
        .folder-structure {
            background-color: #f1f1f1;
            padding: 20px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
        }
        .folder {
            font-weight: bold;
        }
        .file {
            margin-left: 20px;
        }
        .violet-bg {
            background-color: #6610f2;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Infosys Utility - Upload CAMEL Project Folder</h1>
        <form id="uploadForm" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <div class="custom-file">
                    <input type="file" class="custom-file-input" id="file" name="file" webkitdirectory required>
                    <label class="custom-file-label" for="file">Choose folder</label>
                </div>
            </div>
            <button type="submit" class="btn violet-bg btn-block">Upload</button>
        </form>

        <div class="row mt-4">
            <div class="col-md-6">
                <h4>Folder Structure</h4>
                <div class="folder-structure" id="folderStructure">
                    <!-- Folder structure will be displayed here -->
                </div>
            </div>
            <div class="col-md-6">
                <h4>Conversion Status</h4>
                <button id="convertButton" class="btn violet-bg btn-block">Convert</button>
                <div id="conversionMessage" class="mt-3">
                    <!-- Conversion message will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            // Prevent form submission and display folder structure
            $('#uploadForm').on('submit', function(event) {
                event.preventDefault();
                var inputFile = document.getElementById('file');
                displayFolderStructure(inputFile.files);
            });

            // Handle convert button click and make GET request
            $('#convertButton').on('click', function() {
                $.ajax({
                    url: 'http://localhost:8090/CamelToSpring',
                    type: 'GET',
                    success: function(response) {
                        $('#conversionMessage').html('<div class="alert alert-success">Project converted to Spring Boot</div>');
                    },
                    error: function() {
                        $('#conversionMessage').html('<div class="alert alert-danger">Error during conversion</div>');
                    }
                });
            });

            function displayFolderStructure(files) {
                var folderStructure = {};
                var xmlExists = false;

                for (var i = 0; i < files.length; i++) {
                    var path = files[i].webkitRelativePath.split('/');
                    var currentLevel = folderStructure;

                    for (var j = 0; j < path.length; j++) {
                        if (!currentLevel[path[j]]) {
                            currentLevel[path[j]] = (j === path.length - 1) ? null : {};
                        }
                        currentLevel = currentLevel[path[j]];
                    }

                    if (path.includes('src') && path.includes('main') && path.includes('resources') && files[i].name.endsWith('.xml')) {
                        xmlExists = true;
                    }
                }

                if (!xmlExists) {
                    $('#folderStructure').html('<div class="alert alert-danger">Error: Not a valid Camel project. No XML file found in src/main/resources.</div>');
                    return;
                }

                $('#folderStructure').html(renderMainFolderStructure(folderStructure));
            }

            function renderMainFolderStructure(structure, indent = 0) {
                var html = '';
                for (var key in structure) {
                    if (structure[key] === null) {
                        html += '<div class="file" style="margin-left:' + indent + 'px">' + key + '</div>';
                    } else {
                        html += '<div class="folder" style="margin-left:' + indent + 'px">' + key + '</div>';
                    }
                }
                return html;
            }
        });
    </script>
</body>
</html>
